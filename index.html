<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - https://github.com/versatilemanf</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .contact-box {
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .intro {
            margin-bottom: 30px;
            color: #666;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #555;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        .captcha {
            margin: 10px 0 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .privacy {
            margin-top: 15px;
            font-size: 13px;
            color: #777;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .contact-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="contact-box">

        <h1>Contact Us  - https://github.com/versatilemanf</h1>

        <p class="intro">
            Have a question or want to get in touch?
            Send us a message and we'll get back to you.
        </p>

        <form
            action="https://api.web3forms.com/submit"
            method="POST"
        >

            <!-- Web3Forms Access Key -->
            <input
                type="hidden"
                name="access_key"
                value="0a106a51-cb3d-4e89-9f01-f54414237bf6"
            >

            <!-- Email subject -->
            <input
                type="hidden"
                name="subject"
                value="New Contact Form Message"
            >

            <!-- Honeypot spam protection -->
            <input
                type="checkbox"
                name="botcheck"
                style="display:none"
                tabindex="-1"
                autocomplete="off"
            >

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                autocomplete="name"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="message">Message</label>

            <textarea
                id="message"
                name="message"
                placeholder="Write your message..."
                required
            ></textarea>

            <!-- hCaptcha -->
            <div class="captcha">
                <div
                    class="h-captcha"
                    data-captcha="true"
                ></div>
            </div>

            <button type="submit">
                Send Message
            </button>

            <p class="privacy">
                Your email address is only used to respond to your message.
            </p>

        </form>

    </div>

</div>

<!-- Web3Forms hCaptcha integration -->
<script
    src="https://web3forms.com/client/script.js"
    async
    defer>
</script>

</body>
</html>
